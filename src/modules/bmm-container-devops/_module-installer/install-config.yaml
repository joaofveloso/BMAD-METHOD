# BMM-Container-DevOps Module Installer Configuration
# Autonomous AI DevOps Agent Container Deployment
# Infrastructure and deployment via SMTP

code: bmm-container-devops
name: "Container: DevOps (192.168.56.16)"
default_selected: false

header: "DevOps AI Agent Container"
subheader: |
  Deploy the DevOps AI agent to its dedicated container.
  Autonomous agent that manages infrastructure, CI/CD,
  and deployments via SMTP.

  Container IP: 192.168.56.16
  SSH Port: 2226
  Email: devops20251128@gmail.com

# Dependencies
requires:
  - core
  - bmm-contractors

# Container configuration
container:
  name: "devops"
  ip: "192.168.56.16"
  ssh_port: 2226
  agent_file: "bmm-contractors/agents/devops-agent.agent.yaml"

# Gmail configuration
gmail_address:
  prompt: "DevOps agent Gmail address"
  default: "devops20251128@gmail.com"
  result: "{value}"

gmail_app_password:
  prompt: "Gmail App Password for DevOps agent"
  default: ""
  result: "{value}"
  secret: true
  env_var: "DEVOPS_GMAIL_APP_PASSWORD"

# Infrastructure tools
infra_tools:
  prompt: "Infrastructure tools"
  default: ["docker", "github-actions"]
  result: "{value}"
  multi-select:
    - value: "docker"
      label: "Docker"
    - value: "kubernetes"
      label: "Kubernetes"
    - value: "terraform"
      label: "Terraform"
    - value: "github-actions"
      label: "GitHub Actions"
    - value: "gitlab-ci"
      label: "GitLab CI"

# Deployment target
deploy_target:
  prompt: "Primary deployment target"
  default: "docker"
  result: "{value}"
  single-select:
    - value: "docker"
      label: "Docker Compose"
    - value: "kubernetes"
      label: "Kubernetes"
    - value: "vps"
      label: "VPS/VM"
    - value: "cloud"
      label: "Cloud (AWS/GCP/Azure)"

# Polling interval
polling_interval:
  prompt: "Email polling interval (seconds)"
  default: "60"
  result: "{value}"

# Files to install
install_files:
  - source: "bmm-contractors/agents/devops-agent.agent.yaml"
    destination: "agents/devops-agent.agent.yaml"

# Environment variables
env_vars:
  DEVOPS_GMAIL_APP_PASSWORD: "{gmail_app_password}"
  DEVOPS_EMAIL: "{gmail_address}"
  CONTAINER_IP: "192.168.56.16"
  CONTAINER_NAME: "devops"
  DEPLOY_TARGET: "{deploy_target}"
  POLLING_INTERVAL: "{polling_interval}"

post_install_message: |
  DevOps container configured!

  Next steps:
  1. Set up the container at 192.168.56.16
  2. Install Docker, kubectl, and other tools
  3. Copy installed files to the container
  4. Set environment variable: DEVOPS_GMAIL_APP_PASSWORD
  5. Configure deployment credentials
  6. Start the agent runtime (polling mode)
