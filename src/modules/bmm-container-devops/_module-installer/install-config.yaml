# BMM-Container-DevOps Module Installer Configuration
# Autonomous AI DevOps Agent Container Deployment
# Infrastructure and deployment via SMTP
#
# IMPORTANT: All agents must follow the Verification Protocol
# See: src/core/docs/verification-protocol.md

code: bmm-container-devops
name: "Container: DevOps (192.168.56.16)"
default_selected: false

header: "DevOps AI Agent Container"
subheader: |
  Deploy the DevOps AI agent to its dedicated container.
  Autonomous agent that manages infrastructure, CI/CD,
  and deployments via SMTP.

  Container IP: 192.168.56.16
  SSH Port: 2226
  Email: devops@mail.email

# Dependencies
requires:
  - core
  - bmm-contractors

# Container configuration
container:
  name: "devops"
  ip: "192.168.56.16"
  ssh_port: 2226
  agent_file: "bmm-contractors/agents/devops-agent.agent.yaml"

# Local SMTP configuration
email_address:
  prompt: "DevOps agent email address"
  default: "devops@mail.email"
  result: "{value}"

smtp_password:
  prompt: "SMTP password for DevOps agent"
  default: "devops123"
  result: "{value}"
  secret: true
  env_var: "DEVOPS_SMTP_PASSWORD"

# Infrastructure tools
infra_tools:
  prompt: "Infrastructure tools"
  default: ["docker", "github-actions"]
  result: "{value}"
  multi-select:
    - value: "docker"
      label: "Docker"
    - value: "kubernetes"
      label: "Kubernetes"
    - value: "terraform"
      label: "Terraform"
    - value: "github-actions"
      label: "GitHub Actions"
    - value: "gitlab-ci"
      label: "GitLab CI"

# Deployment target
deploy_target:
  prompt: "Primary deployment target"
  default: "docker"
  result: "{value}"
  single-select:
    - value: "docker"
      label: "Docker Compose"
    - value: "kubernetes"
      label: "Kubernetes"
    - value: "vps"
      label: "VPS/VM"
    - value: "cloud"
      label: "Cloud (AWS/GCP/Azure)"

# Polling interval
polling_interval:
  prompt: "Email polling interval (seconds)"
  default: "60"
  result: "{value}"

# Files to install
install_files:
  - source: "bmm-contractors/agents/devops-agent.agent.yaml"
    destination: "agents/devops-agent.agent.yaml"
  - source: "bmm-contractors/scripts/email_processor.py"
    destination: "scripts/email_processor.py"
  - source: "bmm-contractors/scripts/email_manager.py"
    destination: "scripts/email_manager.py"

# Environment variables
env_vars:
  DEVOPS_SMTP_PASSWORD: "{smtp_password}"
  DEVOPS_EMAIL: "{email_address}"
  CONTAINER_IP: "192.168.56.16"
  CONTAINER_NAME: "devops"
  DEPLOY_TARGET: "{deploy_target}"
  POLLING_INTERVAL: "{polling_interval}"

# SMTP config
smtp_config:
  server: "mail.email"
  port: 587
  tls: true
  imap_server: "mail.email"
  imap_port: 993

post_install_message: |
  DevOps container configured!

  Next steps:
  1. Set up the container at 192.168.56.16
  2. Install Docker, kubectl, and other tools
  3. Configure local mail server (Postfix/Dovecot)
  4. Copy installed files to the container
  5. Set environment variable: DEVOPS_SMTP_PASSWORD
  6. Configure deployment credentials
  7. Start the agent runtime (polling mode)
