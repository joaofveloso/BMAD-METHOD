# BMM-Container-Backend Module Installer Configuration
# Autonomous AI Backend Agent Container Deployment
# Java/Spring backend development via SMTP

code: bmm-container-backend
name: "Container: Backend (192.168.56.12)"
default_selected: false

header: "Backend AI Agent Container"
subheader: |
  Deploy the Backend AI agent to its dedicated container.
  Autonomous agent that writes Java/Spring backend code,
  creates PRs, and handles revisions via SMTP.

  Container IP: 192.168.56.12
  SSH Port: 2222
  Email: backend@mail.email

# Dependencies
requires:
  - core
  - bmm-contractors

# Container configuration
container:
  name: "backend"
  ip: "192.168.56.12"
  ssh_port: 2222
  agent_file: "bmm-contractors/agents/backend-agent.agent.yaml"

# Local SMTP configuration
email_address:
  prompt: "Backend agent email address"
  default: "backend@mail.email"
  result: "{value}"

smtp_password:
  prompt: "SMTP password for backend agent"
  default: "backend123"
  result: "{value}"
  secret: true
  env_var: "BACKEND_SMTP_PASSWORD"

# Tech stack
java_version:
  prompt: "Java version"
  default: "21"
  result: "{value}"
  single-select:
    - value: "21"
      label: "Java 21 (LTS)"
    - value: "17"
      label: "Java 17 (LTS)"

spring_version:
  prompt: "Spring Boot version"
  default: "3.x"
  result: "{value}"

# Polling interval
polling_interval:
  prompt: "Email polling interval (seconds)"
  default: "60"
  result: "{value}"

# Files to install
install_files:
  - source: "bmm-contractors/agents/backend-agent.agent.yaml"
    destination: "agents/backend-agent.agent.yaml"
  - source: "bmm-contractors/scripts/email_processor.py"
    destination: "scripts/email_processor.py"
  - source: "bmm-contractors/scripts/email_manager.py"
    destination: "scripts/email_manager.py"

# Environment variables
env_vars:
  BACKEND_SMTP_PASSWORD: "{smtp_password}"
  BACKEND_EMAIL: "{email_address}"
  CONTAINER_IP: "192.168.56.12"
  CONTAINER_NAME: "backend"
  JAVA_VERSION: "{java_version}"
  SPRING_VERSION: "{spring_version}"
  POLLING_INTERVAL: "{polling_interval}"

# SMTP config
smtp_config:
  server: "mail.email"
  port: 587
  tls: true
  imap_server: "mail.email"
  imap_port: 993

post_install_message: |
  Backend container configured!

  Next steps:
  1. Set up the container at 192.168.56.12
  2. Install Java {java_version} and Spring Boot {spring_version}
  3. Configure local mail server (Postfix/Dovecot)
  4. Copy installed files to the container
  5. Set environment variable: BACKEND_SMTP_PASSWORD
  6. Start the agent runtime (polling mode)
