# BMM-Container-Researcher Module Installer Configuration
# Autonomous AI Researcher Agent Container Deployment
# Documentation and research via SMTP
#
# IMPORTANT: All agents must follow the Verification Protocol
# See: src/core/docs/verification-protocol.md

code: bmm-container-researcher
name: "Container: Researcher (192.168.56.17)"
default_selected: false

header: "Researcher AI Agent Container"
subheader: |
  Deploy the Researcher AI agent to its dedicated container.
  Autonomous agent that conducts research, creates documentation,
  and provides technical guidance via SMTP.

  Container IP: 192.168.56.17
  SSH Port: 2227
  Email: researcher@mail.email

# Dependencies
requires:
  - core
  - bmm-contractors

# Container configuration
container:
  name: "researcher"
  ip: "192.168.56.17"
  ssh_port: 2227
  agent_file: "bmm-contractors/agents/researcher-agent.agent.yaml"

# Local SMTP configuration
email_address:
  prompt: "Researcher agent email address"
  default: "researcher@mail.email"
  result: "{value}"

smtp_password:
  prompt: "SMTP password for researcher agent"
  default: "researcher123"
  result: "{value}"
  secret: true
  env_var: "RESEARCHER_SMTP_PASSWORD"

# Research capabilities
research_tools:
  prompt: "Research tools enabled"
  default: ["web-search", "api-docs"]
  result: "{value}"
  multi-select:
    - value: "web-search"
      label: "Web Search"
    - value: "api-docs"
      label: "API Documentation"
    - value: "code-analysis"
      label: "Code Analysis"
    - value: "security-audit"
      label: "Security Audit"

# Polling interval
polling_interval:
  prompt: "Email polling interval (seconds)"
  default: "60"
  result: "{value}"

# Files to install
install_files:
  - source: "bmm-contractors/agents/researcher-agent.agent.yaml"
    destination: "agents/researcher-agent.agent.yaml"
  - source: "bmm-contractors/scripts/email_processor.py"
    destination: "scripts/email_processor.py"
  - source: "bmm-contractors/scripts/email_manager.py"
    destination: "scripts/email_manager.py"

# Environment variables
env_vars:
  RESEARCHER_SMTP_PASSWORD: "{smtp_password}"
  RESEARCHER_EMAIL: "{email_address}"
  CONTAINER_IP: "192.168.56.17"
  CONTAINER_NAME: "researcher"
  POLLING_INTERVAL: "{polling_interval}"

# SMTP config
smtp_config:
  server: "mail.email"
  port: 587
  tls: true
  imap_server: "mail.email"
  imap_port: 993

post_install_message: |
  Researcher container configured!

  Next steps:
  1. Set up the container at 192.168.56.17
  2. Configure local mail server (Postfix/Dovecot)
  3. Copy installed files to the container
  4. Set environment variable: RESEARCHER_SMTP_PASSWORD
  5. Start the agent runtime (polling mode)
