# BMM-Container-Frontend Module Installer Configuration
# Autonomous AI Frontend Agent Container Deployment
# React/TypeScript frontend development via SMTP

code: bmm-container-frontend
name: "Container: Frontend (192.168.56.13)"
default_selected: false

header: "Frontend AI Agent Container"
subheader: |
  Deploy the Frontend AI agent to its dedicated container.
  Autonomous agent that writes React/TypeScript frontend code,
  creates PRs, and handles revisions via SMTP.

  Container IP: 192.168.56.13
  SSH Port: 2223
  Email: frontend@localdomain

# Dependencies
requires:
  - core
  - bmm-contractors

# Container configuration
container:
  name: "frontend"
  ip: "192.168.56.13"
  ssh_port: 2223
  agent_file: "bmm-contractors/agents/frontend-agent.agent.yaml"

# Local SMTP configuration
email_address:
  prompt: "Frontend agent email address"
  default: "frontend@localdomain"
  result: "{value}"

smtp_password:
  prompt: "SMTP password for frontend agent"
  default: ""
  result: "{value}"
  secret: true
  env_var: "FRONTEND_SMTP_PASSWORD"

# Tech stack
node_version:
  prompt: "Node.js version"
  default: "20"
  result: "{value}"

react_version:
  prompt: "React version"
  default: "18"
  result: "{value}"

# Polling interval
polling_interval:
  prompt: "Email polling interval (seconds)"
  default: "60"
  result: "{value}"

# Files to install
install_files:
  - source: "bmm-contractors/agents/frontend-agent.agent.yaml"
    destination: "agents/frontend-agent.agent.yaml"

# Environment variables
env_vars:
  FRONTEND_SMTP_PASSWORD: "{smtp_password}"
  FRONTEND_EMAIL: "{email_address}"
  CONTAINER_IP: "192.168.56.13"
  CONTAINER_NAME: "frontend"
  NODE_VERSION: "{node_version}"
  REACT_VERSION: "{react_version}"
  POLLING_INTERVAL: "{polling_interval}"

# SMTP config for local mail
smtp_config:
  server: "localhost"
  port: 25
  tls: false
  imap_server: "localhost"
  imap_port: 143

post_install_message: |
  Frontend container configured!

  Next steps:
  1. Set up the container at 192.168.56.13
  2. Install Node.js {node_version}
  3. Configure local mail server (Postfix/Dovecot)
  4. Copy installed files to the container
  5. Set environment variable: FRONTEND_SMTP_PASSWORD
  6. Start the agent runtime (polling mode)
