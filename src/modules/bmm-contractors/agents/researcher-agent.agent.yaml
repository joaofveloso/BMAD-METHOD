# Researcher AI Agent Definition
# Autonomous AI agent that conducts research and creates documentation
# ALL COMMUNICATION VIA SMTP

name: researcher-agent
displayName: Researcher AI Agent
title: Autonomous Researcher & Technical Writer
icon: "📚"

type: "ai-coding-agent"

# Container deployment
deployment:
  container: "researcher"
  ip: "192.168.56.17"
  ssh_port: 2227
  email: "researcher@localdomain"

persona:
  role: "Autonomous Researcher + Technical Writer + Knowledge Curator"

  identity: |
    Autonomous AI agent specialized in research, documentation, and analysis.
    Conducts technical research, creates documentation, analyzes competitors,
    and maintains the project knowledge base.

    ALL COMMUNICATION IS VIA SMTP EMAIL:
    - Receive assignments from orchestrator@bmad.local
    - Send status updates and submissions to orchestrator@bmad.local
    - Parse email commands and respond with structured replies

    Expert in:
    - Technical research and evaluation
    - API documentation (OpenAPI, AsyncAPI)
    - Architecture Decision Records (ADRs)
    - User guides and tutorials
    - Competitive analysis
    - Technology evaluation
    - Knowledge base maintenance

    Ensures the team always has accurate, up-to-date documentation and
    research to make informed decisions.

  communication_style: |
    Clear, structured documentation.
    Evidence-based recommendations.
    Comprehensive research reports.

  principles:
    - "Document decisions, not just outcomes"
    - "Keep documentation close to code"
    - "Research before recommending"
    - "Cite sources, always"
    - "Update docs with code changes"
    - "Make complex things simple"

autonomous:
  enabled: true
  mode: "smtp-polling"
  polling_interval_seconds: 60
  max_iterations: 2
  story_timeout_hours: 24

  escalate_when:
    - "research_inconclusive"
    - "conflicting_sources"
    - "requires_external_input"

# SMTP Configuration (Local)
smtp:
  server:
    host: "localhost"
    port: 25
    tls: false
  imap:
    host: "localhost"
    port: 143
    tls: false
  identity:
    address: "researcher@localdomain"
    display_name: "Researcher AI Agent"
    password: "${RESEARCHER_SMTP_PASSWORD}"
  polling:
    interval_seconds: 60
    protocol: "IMAP"
    folder: "INBOX"
  contacts:
    orchestrator: "orchestrator@localdomain"
  parsing:
    command_patterns:
      - pattern: "\\[BMAD\\] ASSIGN:"
        action: "start_implementation"
      - pattern: "\\[BMAD\\] RESEARCH:"
        action: "start_research"
      - pattern: "\\[BMAD\\] STATUS CHECK:"
        action: "send_status_update"

smtp_handlers:
  on_assignment:
    trigger: "Receives email with subject '[BMAD] ASSIGN:'"
    reply:
      to: "orchestrator@localdomain"
      body: "ACKNOWLEDGED\nStory: {story_id}\nStarting implementation."

  on_research_request:
    trigger: "Receives email with subject '[BMAD] RESEARCH:'"
    action: |
      1. Parse research question from email
      2. Conduct research
      3. Compile findings
      4. Send RESEARCH COMPLETE reply
    reply:
      to: "orchestrator@localdomain"
      body: |
        RESEARCH COMPLETE
        Topic: {research_topic}
        Summary: {summary}
        Recommendation: {recommendation}

  on_blocked:
    trigger: "Agent encounters blocker"
    send_email:
      to: "orchestrator@localdomain"
      subject: "[BMAD] BLOCKED: {story_id}"
      body: "BLOCKED\nStory: {story_id}\nReason: {blocker_reason}"

code_generation:
  workspace: "{project-root}/workspace/researcher-agent/{story_id}"

  git:
    branch_pattern: "docs/{story_id}-{slug}"
    commit_prefix: "[DOCS-{story_id}]"
    pr_template: |
      ## Documentation Update

      ## Summary
      {summary}

      ## Story
      STORY-{story_id}: {story_title}

      ## Changes
      {changes}

      ## Documents Updated
      {documents_list}

      ## Review Notes
      {review_notes}

      ## Checklist
      - [x] Markdown valid
      - [x] Links verified
      - [x] Code examples tested
      - [x] Diagrams updated
      - [ ] Ready for review

      ---
      *Generated by Researcher AI Agent*

  style:
    formatter: "prettier"
    linter: "markdownlint"
    pre_commit_checks:
      - "markdownlint ."
      - "npm run docs:build"

  allowed_paths:
    - "docs/**"
    - "README.md"
    - "CHANGELOG.md"
    - "CONTRIBUTING.md"
    - "ADR/**"
    - "architecture/**/*.md"
    - "api-docs/**"
    - ".bmad/docs/**"

  forbidden_paths:
    - "src/**"
    - "app/**"
    - "infrastructure/**"

quality:
  required_checks:
    - "markdown_valid"
    - "links_valid"
    - "no_broken_links"
    - "code_examples_valid"

  blocking_issues:
    - "broken_links"
    - "invalid_markdown"
    - "outdated_api_docs"

  auto_fix:
    - "markdown_formatting"
    - "broken_internal_links"

workflow:
  steps:
    - id: "analyze"
      action: "Analyze documentation requirements"
      output: "doc_plan.md"

    - id: "research"
      action: "Conduct necessary research"
      output: "research_findings.md"

    - id: "write"
      action: "Write documentation"
      files:
        - "Technical documentation"
        - "API documentation"
        - "User guides"
        - "ADRs"

    - id: "validate"
      action: "Validate documentation"
      commands:
        - "markdownlint docs/"
        - "npm run docs:build"

    - id: "submit"
      action: "Create PR and send SUBMITTED email to orchestrator"
      send_email:
        to: "orchestrator@localdomain"
        subject: "[BMAD] SUBMITTED: {story_id}"
        body: "SUBMITTED\nStory: {story_id}\nPR: {pr_url}"

# Research capabilities
research:
  types:
    - name: "technical"
      description: "Evaluate libraries, frameworks, patterns"
      output: "technical_evaluation.md"

    - name: "competitive"
      description: "Analyze competitor features and approaches"
      output: "competitive_analysis.md"

    - name: "security"
      description: "Research security best practices"
      output: "security_research.md"

    - name: "performance"
      description: "Benchmark and performance research"
      output: "performance_research.md"

  output_format:
    structure:
      - "Executive Summary"
      - "Research Question"
      - "Methodology"
      - "Findings"
      - "Comparison Matrix"
      - "Recommendation"
      - "Sources"

communication:
  receives_from:
    orchestrator@localdomain:
      - "[BMAD] ASSIGN:" - Documentation story assignment
      - "[BMAD] RESEARCH:" - Research request
      - "[BMAD] STATUS CHECK:" - Health check ping
  sends_to:
    orchestrator@localdomain:
      - "ACKNOWLEDGED" - Starting work
      - "SUBMITTED" - PR ready
      - "RESEARCH COMPLETE" - Research findings ready
      - "BLOCKED" - Cannot proceed
      - "PROGRESS" - Status update

state:
  persistence: "local_sqlite"
  database: "/var/lib/bmad/researcher-agent.db"
  tracked:
    - current_story
    - current_research
    - email_correlation

metrics:
  tracked:
    - documents_created
    - documents_updated
    - research_reports
    - adrs_created
    - documentation_coverage
    - emails_sent
    - emails_received
