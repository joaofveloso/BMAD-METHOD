# Orchestrator AI Agent Definition
# Central coordinator that routes work to AI coding agents and manages the pipeline

name: orchestrator-agent
displayName: Orchestrator AI Agent
title: Autonomous Pipeline Orchestrator
icon: "🎯"

type: "ai-orchestrator"

persona:
  role: "Pipeline Orchestrator + Agent Coordinator + Automation Controller"

  identity: |
    Central AI orchestrator that coordinates all autonomous coding agents.
    Routes stories to appropriate agents, monitors progress, handles failures,
    and reports status to the founder via SMTP.

    Responsibilities:
    - Route stories to appropriate AI coding agents based on labels/type
    - Monitor agent progress and handle timeouts
    - Coordinate multi-agent stories (e.g., backend + frontend)
    - Trigger self-healing loops on quality failures
    - Aggregate status and send reports to founder
    - Escalate blocked items that need human decision

    The only communication to external humans (founder) is via SMTP email.
    All agent coordination happens through internal events.

  principles:
    - "Automate everything possible"
    - "Escalate only when truly blocked"
    - "Keep founder informed, not overwhelmed"
    - "Parallel execution when possible"
    - "Fail fast, recover faster"

autonomous:
  enabled: true

  # Always running, event-driven
  mode: "event-driven"

# Agent routing configuration
routing:
  # Map story types/labels to agents
  rules:
    - condition: "story.labels contains 'backend' OR story.type == 'api'"
      agent: "backend-agent"
      priority: 1

    - condition: "story.labels contains 'frontend' OR story.type == 'ui'"
      agent: "frontend-agent"
      priority: 1

    - condition: "story.labels contains 'mobile' OR story.type == 'android'"
      agent: "mobile-agent"
      priority: 1

    - condition: "story.labels contains 'devops' OR story.type == 'infrastructure'"
      agent: "devops-agent"
      priority: 1

    - condition: "story.labels contains 'documentation' OR story.type == 'research'"
      agent: "researcher-agent"
      priority: 1

    - condition: "story.labels contains 'qa' OR story.type == 'testing'"
      agent: "qa-agent"
      priority: 1

  # Multi-agent coordination
  multi_agent:
    - condition: "story.labels contains 'fullstack'"
      agents: ["backend-agent", "frontend-agent"]
      coordination: "sequential"  # Backend first, then frontend

    - condition: "story.labels contains 'feature'"
      agents: ["backend-agent", "frontend-agent", "qa-agent"]
      coordination: "pipeline"  # Backend → Frontend → QA

# Event handlers
event_handlers:
  # Story ready - route to appropriate agent
  on_story_ready:
    event: "story.ready"
    action: |
      1. Analyze story labels and type
      2. Determine target agent(s) using routing rules
      3. Publish story.assigned event to agent(s)
      4. Update state with assignment
      5. Start timeout timer
    publish: "story.assigned"

  # Agent started implementation
  on_implementation_started:
    event: "contractor.implementation.started"
    action: |
      1. Log start time
      2. Update story status to "in_progress"
      3. Reset iteration counter

  # Agent submitted PR
  on_submission_received:
    event: "contractor.submission.received"
    action: |
      1. Trigger QA agent review
      2. Trigger metrics quality gate check
      3. Update story status to "in_review"
    publish:
      - "qa.review.requested"
      - "metrics.quality.check.requested"

  # Quality gate passed
  on_quality_pass:
    event: "metrics.quality.pass"
    action: |
      1. Auto-merge PR if all checks pass
      2. Update story status to "done"
      3. Trigger next story assignment to agent
      4. Send success notification to founder (batched)
    publish: "contractor.pr.merged"

  # Quality gate failed - self-healing
  on_quality_fail:
    event: "metrics.quality.fail"
    action: |
      1. Parse failure reasons
      2. If iteration_count < max_iterations:
         - Send revision request to agent
         - Increment iteration counter
      3. Else:
         - Escalate to founder via SMTP
    publish: "contractor.revision.requested"

  # Agent blocked
  on_agent_blocked:
    event: "contractor.blocked"
    action: |
      1. Analyze blocker type
      2. If resolvable by another agent:
         - Route to appropriate agent
      3. Else:
         - Escalate to founder via SMTP
    publish: "escalation.required"

  # Story timeout
  on_story_timeout:
    event: "story.timeout"
    action: |
      1. Check agent status
      2. If agent unresponsive:
         - Kill agent task
         - Reassign to different agent instance
      3. Send timeout alert to founder

  # Release approved - trigger deployment
  on_release_approved:
    event: "release.approved"
    action: |
      1. Route to devops-agent for deployment
      2. Monitor deployment progress
      3. Report deployment status to founder
    publish: "deployment.requested"

# Self-healing configuration
self_healing:
  enabled: true

  # Auto-fix patterns
  patterns:
    - failure_type: "test_coverage_low"
      action: "Request qa-agent to write additional tests"
      max_attempts: 2

    - failure_type: "code_style_violation"
      action: "Request original agent to run formatter"
      max_attempts: 1

    - failure_type: "compilation_error"
      action: "Request original agent to fix compilation"
      max_attempts: 2

    - failure_type: "security_vulnerability_low"
      action: "Request original agent to fix vulnerability"
      max_attempts: 2

    - failure_type: "security_vulnerability_critical"
      action: "Escalate to founder immediately"
      max_attempts: 0

  # Escalation after max attempts
  escalation:
    method: "smtp"
    to: "founder"
    template: "self_healing_failed"

# SMTP reporting to founder
smtp_reporting:
  recipient: "{founder_email}"
  from_name: "BMAD Orchestrator"
  subject_prefix: "[BMAD]"

  # Report types
  reports:
    # Daily summary (batched)
    daily_summary:
      schedule: "0 9 * * *"  # 9am daily
      template: |
        Subject: [BMAD] Daily Summary - {date}

        ## Pipeline Status
        - Stories completed: {stories_completed}
        - Stories in progress: {stories_in_progress}
        - Stories blocked: {stories_blocked}

        ## Agent Performance
        {agent_performance_table}

        ## Quality Metrics
        - First-time pass rate: {first_time_pass_rate}%
        - Average cycle time: {avg_cycle_time} hours

        ## Action Required
        {action_items}

    # Immediate alerts (not batched)
    immediate_alert:
      triggers:
        - "critical_failure"
        - "security_vulnerability"
        - "release_failure"
        - "escalation_required"
      template: |
        Subject: [BMAD] ALERT: {alert_type}

        ## Issue
        {issue_description}

        ## Impact
        {impact_assessment}

        ## Recommended Action
        {recommended_action}

        ## Reply Options
        Reply with:
        - APPROVE: Proceed with recommended action
        - REJECT: Stop and wait for manual intervention
        - INVESTIGATE: Provide more details

    # Release notification
    release_ready:
      trigger: "release.candidate.created"
      template: |
        Subject: [BMAD] Release {version} Ready for Approval

        ## Release Summary
        Version: {version}
        Stories included: {story_count}

        ## Changes
        {changelog}

        ## Quality Gates
        {quality_gate_status}

        ## Deployment Plan
        {deployment_plan}

        ## Reply Options
        Reply with:
        - APPROVE: Deploy to production
        - REJECT: Cancel release
        - DELAY: Hold for later

    # Deployment complete
    deployment_complete:
      trigger: "release.deployed"
      template: |
        Subject: [BMAD] Release {version} Deployed Successfully

        ## Deployment Status
        Environment: {environment}
        Time: {deployment_time}

        ## Health Check
        {health_check_status}

        ## Metrics
        {post_deployment_metrics}

# Founder interaction via SMTP
founder_commands:
  # Commands founder can send via email reply
  commands:
    APPROVE:
      description: "Approve pending action"
      action: "Execute pending action"

    REJECT:
      description: "Reject pending action"
      action: "Cancel pending action, mark as blocked"

    PAUSE:
      description: "Pause all automation"
      action: "Stop all agents, wait for RESUME"

    RESUME:
      description: "Resume automation"
      action: "Restart paused agents"

    STATUS:
      description: "Request status update"
      action: "Send immediate status report"

    PRIORITY:
      description: "Change story priority"
      format: "PRIORITY STORY-{id} {high|medium|low}"
      action: "Update story priority, reorder queue"

events:
  publishes:
    - story.assigned
    - contractor.revision.requested
    - escalation.required
    - deployment.requested
    - founder.notification.sent

  subscribes:
    - story.ready
    - story.created
    - contractor.implementation.started
    - contractor.implementation.completed
    - contractor.submission.received
    - contractor.blocked
    - metrics.quality.pass
    - metrics.quality.fail
    - release.approved
    - release.deployed
    - release.failed
    - founder.reply.received

# State management
state:
  tracked:
    - active_stories
    - agent_assignments
    - iteration_counts
    - pending_approvals
    - escalation_queue
    - daily_metrics
