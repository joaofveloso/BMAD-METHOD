# BMM-Contractors Module Manifest
# Fully Automated AI Coding Pipeline
# Version: 2.1.0 - SMTP-Only Architecture

name: bmm-contractors
version: "2.1.0"
display_name: "BMAD Autonomous Execution Layer"
description: "Fully automated AI coding agents with SMTP-only communication. No internal event bus - all inter-agent and founder communication via email."
author: "BMad"
license: "MIT"

# Module category and tags
category: "automation"
tags:
  - ai-agents
  - autonomous
  - coding
  - automation
  - pipeline
  - self-healing
  - smtp-only
  - git
  - email-driven

# Communication Architecture
communication:
  mode: "smtp-only"
  description: |
    ALL communication happens via SMTP email through Gmail:
    - Inter-agent communication via Gmail accounts
    - Founder communication via Gmail
    - No internal event bus or message queues
    - Email polling every 60 seconds via IMAP

  smtp_server:
    host: "localhost"
    port: 25
    tls: false
  imap_server:
    host: "localhost"
    port: 143
    tls: false
  note: "Each container runs local mail server (e.g., Postfix/Dovecot)"

# Automation mode
automation:
  mode: "full" # full | supervised | manual
  description: |
    Full E2E automation with SMTP-only communication:
    - AI agents write code autonomously
    - Self-healing on quality gate failures (max 3 iterations)
    - Auto-merge on passing checks
    - Auto-deployment on founder approval
    - All status via SMTP to founder
    - Inter-agent coordination via SMTP

# Dependencies
dependencies:
  core:
    version: ">=1.0.0"
    required: true
  bmm:
    version: ">=1.0.0"
    required: true
    reason: "Story and sprint integration"
  bmm-metrics:
    version: ">=1.0.0"
    required: true
    reason: "Quality gates and automated checks"
  bmm-release:
    version: ">=1.0.0"
    required: true
    reason: "Automated release and deployment"

# Container Deployment Architecture
containers:
  founder:
    ip: "192.168.56.10"
    ssh_port: 2220
    email: "founder@mail.email"
    password_env: "FOUNDER_SMTP_PASSWORD"
    purpose: "Leadership & approvals"

  orchestrator:
    ip: "192.168.56.11"
    ssh_port: 2221
    email: "orchestrator@mail.email"
    password_env: "ORCHESTRATOR_SMTP_PASSWORD"
    purpose: "Central coordinator - routes work to agents via SMTP"

  backend:
    ip: "192.168.56.12"
    ssh_port: 2222
    email: "backend@mail.email"
    password_env: "BACKEND_SMTP_PASSWORD"
    purpose: "Java/Spring backend development"

  frontend:
    ip: "192.168.56.13"
    ssh_port: 2223
    email: "frontend@mail.email"
    password_env: "FRONTEND_SMTP_PASSWORD"
    purpose: "React/TypeScript frontend development"

  mobile:
    ip: "192.168.56.14"
    ssh_port: 2224
    email: "android@mail.email"
    password_env: "MOBILE_SMTP_PASSWORD"
    purpose: "Android/Kotlin mobile development"

  qa:
    ip: "192.168.56.15"
    ssh_port: 2225
    email: "qa@mail.email"
    password_env: "QA_SMTP_PASSWORD"
    purpose: "Test automation and QA review"

  devops:
    ip: "192.168.56.16"
    ssh_port: 2226
    email: "devops@mail.email"
    password_env: "DEVOPS_SMTP_PASSWORD"
    purpose: "Infrastructure and deployments"

  researcher:
    ip: "192.168.56.17"
    ssh_port: 2227
    email: "researcher@mail.email"
    password_env: "RESEARCHER_SMTP_PASSWORD"
    purpose: "Documentation and research"

# SMTP Communication (replaces events)
smtp_communication:
  description: |
    All communication happens via SMTP email.
    No internal event bus - agents poll their inbox every 60 seconds.

  # Email patterns for inter-agent communication
  email_patterns:
    # From Orchestrator to Agents
    assignment: "[BMAD] ASSIGN: {story_id}"
    revision: "[BMAD] REVISION: {story_id}"
    complete: "[BMAD] COMPLETE: {story_id}"
    status_check: "[BMAD] STATUS CHECK: {story_id}"
    review_request: "[BMAD] REVIEW: PR#{pr_number}"
    deploy_request: "[BMAD] DEPLOY: Release {version}"

    # From Agents to Orchestrator
    acknowledged: "ACKNOWLEDGED"
    submitted: "SUBMITTED"
    blocked: "BLOCKED"
    progress: "PROGRESS"
    qa_pass: "QA PASS"
    qa_fail: "QA FAIL"
    quality_pass: "QUALITY PASS"
    quality_fail: "QUALITY FAIL"
    deployed: "DEPLOYED"
    deploy_failed: "DEPLOY FAILED"

    # From Founder (email replies)
    approve: "APPROVE"
    reject: "REJECT"
    pause: "PAUSE"
    resume: "RESUME"
    status: "STATUS"
    rollback: "ROLLBACK {version}"
    unblock: "UNBLOCK {story_id}"

# Agents provided by this module
agents:
  # Founder (interactive strategic agent)
  - name: founder-agent
    file: agents/founder-agent.agent.yaml
    description: "Interactive AI agent that helps founder organize work and command the pipeline"
    icon: "👑"
    type: "ai-founder-agent"
    autonomous: false # Interactive mode - founder drives it

  # Orchestrator (central coordinator)
  - name: orchestrator-agent
    file: agents/orchestrator-agent.agent.yaml
    description: "Central coordinator that routes work to AI agents and manages the pipeline"
    icon: "🎯"
    type: "orchestrator"
    autonomous: true

  # AI Coding Agents
  - name: backend-agent
    file: agents/backend-agent.agent.yaml
    description: "Autonomous AI agent that writes Java/Spring backend code"
    icon: "☕"
    type: "ai-coding-agent"
    autonomous: true

  - name: frontend-agent
    file: agents/frontend-agent.agent.yaml
    description: "Autonomous AI agent that writes React/TypeScript frontend code"
    icon: "⚛️"
    type: "ai-coding-agent"
    autonomous: true

  - name: mobile-agent
    file: agents/mobile-agent.agent.yaml
    description: "Autonomous AI agent that writes Android/Kotlin mobile code"
    icon: "📱"
    type: "ai-coding-agent"
    autonomous: true

  - name: qa-agent
    file: agents/qa-agent.agent.yaml
    description: "Autonomous AI agent that writes tests and validates quality"
    icon: "🧪"
    type: "ai-coding-agent"
    autonomous: true

  - name: devops-agent
    file: agents/devops-agent.agent.yaml
    description: "Autonomous AI agent that manages infrastructure and deployments"
    icon: "🔧"
    type: "ai-coding-agent"
    autonomous: true

  - name: researcher-agent
    file: agents/researcher-agent.agent.yaml
    description: "Autonomous AI agent that conducts research and creates documentation"
    icon: "📚"
    type: "ai-coding-agent"
    autonomous: true

# Legacy coordinator (for backward compatibility)
legacy_agents:
  - name: contractor-coordinator
    file: agents/contractor-coordinator.agent.yaml
    description: "Legacy coordinator for human contractor teams"
    icon: "📡"
    deprecated: true
    use_instead: "orchestrator-agent"

# Automated workflows
workflows:
  # Fully automated - triggered by events
  - name: auto-assign-story
    path: workflows/auto-assign-story
    description: "Automatically assigns stories to appropriate AI agents"
    automation:
      trigger: "story.ready"
      auto: true

  - name: auto-review-submission
    path: workflows/auto-review-submission
    description: "Automatically reviews and validates agent submissions"
    automation:
      trigger: "contractor.submission.received"
      auto: true

  - name: self-healing
    path: workflows/self-healing
    description: "Automatically fixes quality gate failures"
    automation:
      trigger: "metrics.quality.fail"
      auto: true

  - name: auto-merge
    path: workflows/auto-merge
    description: "Automatically merges PRs that pass all checks"
    automation:
      trigger: "metrics.quality.pass"
      auto: true

  - name: auto-deploy
    path: workflows/auto-deploy
    description: "Automatically deploys approved releases"
    automation:
      trigger: "release.approved"
      auto: true

  # Scheduled automation
  - name: daily-summary
    path: workflows/daily-summary
    description: "Sends daily status summary to founder"
    automation:
      scheduled: "0 9 * * *"
      auto: true

  - name: agent-health-check
    path: workflows/agent-health-check
    description: "Monitors agent health and restarts if needed"
    automation:
      scheduled: "*/15 * * * *"
      auto: true

# Event handlers
event_handlers:
  - name: automation-handlers
    file: events/handlers/automation-handlers.yaml
    description: "Core automation event handlers for the pipeline"

# Email templates
templates:
  # Founder communication templates
  founder:
    - name: founder-daily-summary
      file: templates/email/founder-daily-summary.md
      description: "Daily status summary for founder"

    - name: founder-release-approval
      file: templates/email/founder-release-approval.md
      description: "Release approval request for founder"

    - name: founder-alert
      file: templates/email/founder-alert.md
      description: "Critical alert notification for founder"

    - name: founder-deployment-complete
      file: templates/email/founder-deployment-complete.md
      description: "Deployment completion notification"

    - name: founder-command-confirmed
      file: templates/email/founder-command-confirmed.md
      description: "Confirmation of founder command execution"

  # Inter-agent communication templates (Orchestrator to Agents)
  agent_outbound:
    - name: agent-story-assignment
      file: templates/email/agent-story-assignment.md
      description: "Story assignment to AI agent"

    - name: agent-revision-request
      file: templates/email/agent-revision-request.md
      description: "Request agent to fix quality failures"

    - name: agent-story-complete
      file: templates/email/agent-story-complete.md
      description: "Notify agent story was merged"

    - name: agent-status-check
      file: templates/email/agent-status-check.md
      description: "Health check / timeout warning"

    - name: agent-assist-request
      file: templates/email/agent-assist-request.md
      description: "Request one agent to help another"

  # QA and Metrics templates
  qa_metrics:
    - name: qa-review-request
      file: templates/email/qa-review-request.md
      description: "Request QA agent to review PR"

    - name: quality-check-request
      file: templates/email/quality-check-request.md
      description: "Request metrics system to run quality gates"

  # DevOps templates
  devops:
    - name: devops-deploy-request
      file: templates/email/devops-deploy-request.md
      description: "Request deployment from DevOps agent"

# Configuration schema
config_schema:
  # Founder configuration
  founder:
    type: object
    required: true
    description: "Founder contact for approvals and escalations"
    properties:
      email:
        type: string
        required: true
        description: "Founder's email address for SMTP communication"
      name:
        type: string
        description: "Founder's name"
      timezone:
        type: string
        default: "UTC"
        description: "Founder's timezone for scheduling"

  # SMTP configuration
  smtp:
    type: object
    required: true
    properties:
      host:
        type: string
        description: "SMTP server hostname"
      port:
        type: integer
        default: 587
      secure:
        type: boolean
        default: true
      auth:
        type: object
        properties:
          user:
            type: string
          pass:
            type: string
            secret: true
      from_address:
        type: string
        description: "From address for outgoing emails"
      from_name:
        type: string
        default: "BMAD Orchestrator"
        description: "From name for outgoing emails"

  # Git configuration
  git:
    type: object
    required: true
    properties:
      provider:
        type: string
        enum: ["github", "gitlab", "bitbucket"]
      organization:
        type: string
      repository:
        type: string
      main_branch:
        type: string
        default: "main"
      auto_merge:
        type: boolean
        default: true
        description: "Auto-merge PRs that pass all checks"

  # Automation settings
  automation:
    type: object
    properties:
      max_iterations:
        type: integer
        default: 3
        description: "Max self-healing iterations before escalating"
      story_timeout_hours:
        type: integer
        default: 48
        description: "Hours before a story times out"
      daily_summary_time:
        type: string
        default: "09:00"
        description: "Time to send daily summary (founder timezone)"
      auto_deploy:
        type: boolean
        default: false
        description: "Auto-deploy on founder approval without manual trigger"

  # Agent configuration
  agents:
    type: object
    properties:
      enabled:
        type: array
        items:
          type: string
          enum: ["backend-agent", "frontend-agent", "mobile-agent", "qa-agent", "devops-agent", "researcher-agent"]
        default: ["backend-agent", "frontend-agent", "qa-agent", "devops-agent"]
        description: "Which AI agents to enable"
      parallel_execution:
        type: boolean
        default: true
        description: "Allow multiple agents to work in parallel"

# Installation hooks
hooks:
  post_install:
    - action: "create_config"
      template: "config.yaml"
    - action: "create_state"
      template: "state/module-state.yaml"
    - action: "validate_smtp"
      required: true
    - action: "validate_git"
      required: true
    - action: "validate_founder_email"
      required: true
    - action: "log"
      message: "Autonomous Execution Layer installed. AI agents ready. Configure founder email for status reports."

  pre_uninstall:
    - action: "stop_agents"
    - action: "backup_state"
      path: "state/"
    - action: "warn"
      message: "Stopping all AI agents. Pending work will be lost."
