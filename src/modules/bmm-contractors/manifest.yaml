# BMM-Contractors Module Manifest
# Fully Automated AI Coding Pipeline
# Version: 2.0.0

name: bmm-contractors
version: "2.0.0"
display_name: "BMAD Autonomous Execution Layer"
description: "Fully automated AI coding agents that implement stories, write tests, deploy code, and self-heal on failures. SMTP communication only to founder for status/approvals."
author: "BMad"
license: "MIT"

# Module category and tags
category: "automation"
tags:
  - ai-agents
  - autonomous
  - coding
  - automation
  - pipeline
  - self-healing
  - smtp
  - git

# Automation mode
automation:
  mode: "full"  # full | supervised | manual
  description: |
    Full E2E automation:
    - AI agents write code autonomously
    - Self-healing on quality gate failures
    - Auto-merge on passing checks
    - Auto-deployment on release approval
    - SMTP reports only to founder

# Dependencies
dependencies:
  core:
    version: ">=1.0.0"
    required: true
  bmm:
    version: ">=1.0.0"
    required: true
    reason: "Story and sprint integration"
  bmm-metrics:
    version: ">=1.0.0"
    required: true
    reason: "Quality gates and automated checks"
  bmm-release:
    version: ">=1.0.0"
    required: true
    reason: "Automated release and deployment"

# Event Integration
events:
  subscribes:
    # From BMM core - story lifecycle
    - story.created
    - story.ready
    - story.done
    - sprint.started
    - sprint.ended
    # From bmm-metrics
    - metrics.quality.pass
    - metrics.quality.fail
    - metrics.quality.check.requested
    # From bmm-release
    - release.candidate.created
    - release.approved
    - release.deployed
    - release.failed
    # Founder communication
    - founder.reply.received
    - smtp.email.received

  publishes:
    # Story assignment events
    - story.assigned
    - story.reassigned
    - story.timeout
    # Agent implementation events
    - contractor.implementation.started
    - contractor.implementation.completed
    - contractor.submission.received
    - contractor.revision.requested
    - contractor.blocked
    # Git events
    - contractor.branch.created
    - contractor.pr.opened
    - contractor.pr.merged
    - contractor.pr.rejected
    # QA events
    - qa.review.requested
    - qa.review.completed
    - qa.approved
    - qa.rejected
    # Deployment events
    - deployment.requested
    - deployment.started
    - deployment.completed
    # Escalation events
    - escalation.required
    # Founder communication
    - founder.notification.sent

# Agents provided by this module
agents:
  # Orchestrator (central coordinator)
  - name: orchestrator-agent
    file: agents/orchestrator-agent.agent.yaml
    description: "Central coordinator that routes work to AI agents and manages the pipeline"
    icon: "🎯"
    type: "orchestrator"
    autonomous: true

  # AI Coding Agents
  - name: backend-agent
    file: agents/backend-agent.agent.yaml
    description: "Autonomous AI agent that writes Java/Spring backend code"
    icon: "☕"
    type: "ai-coding-agent"
    autonomous: true

  - name: frontend-agent
    file: agents/frontend-agent.agent.yaml
    description: "Autonomous AI agent that writes React/TypeScript frontend code"
    icon: "⚛️"
    type: "ai-coding-agent"
    autonomous: true

  - name: mobile-agent
    file: agents/mobile-agent.agent.yaml
    description: "Autonomous AI agent that writes Android/Kotlin mobile code"
    icon: "📱"
    type: "ai-coding-agent"
    autonomous: true

  - name: qa-agent
    file: agents/qa-agent.agent.yaml
    description: "Autonomous AI agent that writes tests and validates quality"
    icon: "🧪"
    type: "ai-coding-agent"
    autonomous: true

  - name: devops-agent
    file: agents/devops-agent.agent.yaml
    description: "Autonomous AI agent that manages infrastructure and deployments"
    icon: "🔧"
    type: "ai-coding-agent"
    autonomous: true

  - name: researcher-agent
    file: agents/researcher-agent.agent.yaml
    description: "Autonomous AI agent that conducts research and creates documentation"
    icon: "📚"
    type: "ai-coding-agent"
    autonomous: true

# Legacy coordinator (for backward compatibility)
legacy_agents:
  - name: contractor-coordinator
    file: agents/contractor-coordinator.agent.yaml
    description: "Legacy coordinator for human contractor teams"
    icon: "📡"
    deprecated: true
    use_instead: "orchestrator-agent"

# Automated workflows
workflows:
  # Fully automated - triggered by events
  - name: auto-assign-story
    path: workflows/auto-assign-story
    description: "Automatically assigns stories to appropriate AI agents"
    automation:
      trigger: "story.ready"
      auto: true

  - name: auto-review-submission
    path: workflows/auto-review-submission
    description: "Automatically reviews and validates agent submissions"
    automation:
      trigger: "contractor.submission.received"
      auto: true

  - name: self-healing
    path: workflows/self-healing
    description: "Automatically fixes quality gate failures"
    automation:
      trigger: "metrics.quality.fail"
      auto: true

  - name: auto-merge
    path: workflows/auto-merge
    description: "Automatically merges PRs that pass all checks"
    automation:
      trigger: "metrics.quality.pass"
      auto: true

  - name: auto-deploy
    path: workflows/auto-deploy
    description: "Automatically deploys approved releases"
    automation:
      trigger: "release.approved"
      auto: true

  # Scheduled automation
  - name: daily-summary
    path: workflows/daily-summary
    description: "Sends daily status summary to founder"
    automation:
      scheduled: "0 9 * * *"
      auto: true

  - name: agent-health-check
    path: workflows/agent-health-check
    description: "Monitors agent health and restarts if needed"
    automation:
      scheduled: "*/15 * * * *"
      auto: true

# Event handlers
event_handlers:
  - name: automation-handlers
    file: events/handlers/automation-handlers.yaml
    description: "Core automation event handlers for the pipeline"

# Email templates for founder communication
templates:
  - name: founder-daily-summary
    file: templates/email/founder-daily-summary.md
    description: "Daily status summary for founder"

  - name: founder-release-approval
    file: templates/email/founder-release-approval.md
    description: "Release approval request for founder"

  - name: founder-alert
    file: templates/email/founder-alert.md
    description: "Critical alert notification for founder"

  - name: founder-deployment-complete
    file: templates/email/founder-deployment-complete.md
    description: "Deployment completion notification"

# Configuration schema
config_schema:
  # Founder configuration
  founder:
    type: object
    required: true
    description: "Founder contact for approvals and escalations"
    properties:
      email:
        type: string
        required: true
        description: "Founder's email address for SMTP communication"
      name:
        type: string
        description: "Founder's name"
      timezone:
        type: string
        default: "UTC"
        description: "Founder's timezone for scheduling"

  # SMTP configuration
  smtp:
    type: object
    required: true
    properties:
      host:
        type: string
        description: "SMTP server hostname"
      port:
        type: integer
        default: 587
      secure:
        type: boolean
        default: true
      auth:
        type: object
        properties:
          user:
            type: string
          pass:
            type: string
            secret: true
      from_address:
        type: string
        description: "From address for outgoing emails"
      from_name:
        type: string
        default: "BMAD Orchestrator"
        description: "From name for outgoing emails"

  # Git configuration
  git:
    type: object
    required: true
    properties:
      provider:
        type: string
        enum: ["github", "gitlab", "bitbucket"]
      organization:
        type: string
      repository:
        type: string
      main_branch:
        type: string
        default: "main"
      auto_merge:
        type: boolean
        default: true
        description: "Auto-merge PRs that pass all checks"

  # Automation settings
  automation:
    type: object
    properties:
      max_iterations:
        type: integer
        default: 3
        description: "Max self-healing iterations before escalating"
      story_timeout_hours:
        type: integer
        default: 48
        description: "Hours before a story times out"
      daily_summary_time:
        type: string
        default: "09:00"
        description: "Time to send daily summary (founder timezone)"
      auto_deploy:
        type: boolean
        default: false
        description: "Auto-deploy on founder approval without manual trigger"

  # Agent configuration
  agents:
    type: object
    properties:
      enabled:
        type: array
        items:
          type: string
          enum: ["backend-agent", "frontend-agent", "mobile-agent", "qa-agent", "devops-agent", "researcher-agent"]
        default: ["backend-agent", "frontend-agent", "qa-agent", "devops-agent"]
        description: "Which AI agents to enable"
      parallel_execution:
        type: boolean
        default: true
        description: "Allow multiple agents to work in parallel"

# Installation hooks
hooks:
  post_install:
    - action: "create_config"
      template: "config.yaml"
    - action: "create_state"
      template: "state/module-state.yaml"
    - action: "validate_smtp"
      required: true
    - action: "validate_git"
      required: true
    - action: "validate_founder_email"
      required: true
    - action: "log"
      message: "Autonomous Execution Layer installed. AI agents ready. Configure founder email for status reports."

  pre_uninstall:
    - action: "stop_agents"
    - action: "backup_state"
      path: "state/"
    - action: "warn"
      message: "Stopping all AI agents. Pending work will be lost."
