# BMM-Container-Founder Module Installer Configuration
# Autonomous AI Founder Agent Container Deployment
# Interactive agent for organizing work and commanding the pipeline

code: bmm-container-founder
name: "Container: Founder (192.168.56.10)"
default_selected: false

header: "Founder AI Agent Container"
subheader: |
  Deploy the Founder AI agent to its dedicated container.
  Interactive agent that helps brainstorm ideas, create stories,
  and command the autonomous coding pipeline via SMTP.

  Container IP: 192.168.56.10
  SSH Port: 2220
  Email: founder@localdomain

# Dependencies
requires:
  - core
  - bmm-contractors

# Container configuration
container:
  name: "founder"
  ip: "192.168.56.10"
  ssh_port: 2220
  agent_file: "bmm-contractors/agents/founder-agent.agent.yaml"

# Local SMTP configuration
email_address:
  prompt: "Founder email address"
  default: "founder@localdomain"
  result: "{value}"

smtp_password:
  prompt: "SMTP password for founder"
  default: ""
  result: "{value}"
  secret: true
  env_var: "FOUNDER_SMTP_PASSWORD"

# Agent mode
agent_mode:
  prompt: "Agent operation mode"
  default: "interactive"
  result: "{value}"
  single-select:
    - value: "interactive"
      label: "Interactive - You chat directly with the agent"
    - value: "scheduled"
      label: "Scheduled - Agent runs on schedule (cron)"

# Polling interval
polling_interval:
  prompt: "Email polling interval (seconds)"
  default: "60"
  result: "{value}"

# Files to install
install_files:
  - source: "bmm-contractors/agents/founder-agent.agent.yaml"
    destination: "agents/founder-agent.agent.yaml"
  - source: "bmm-contractors/templates/email/"
    destination: "templates/email/"

# Environment variables to set
env_vars:
  FOUNDER_SMTP_PASSWORD: "{smtp_password}"
  FOUNDER_EMAIL: "{email_address}"
  CONTAINER_IP: "192.168.56.10"
  CONTAINER_NAME: "founder"
  AGENT_MODE: "{agent_mode}"
  POLLING_INTERVAL: "{polling_interval}"

# SMTP config for local mail
smtp_config:
  server: "localhost"
  port: 25
  tls: false
  imap_server: "localhost"
  imap_port: 143

post_install_message: |
  Founder container configured!

  Next steps:
  1. Set up the container at 192.168.56.10
  2. Configure local mail server (Postfix/Dovecot)
  3. Copy installed files to the container
  4. Set environment variable: FOUNDER_SMTP_PASSWORD
  5. Start the agent runtime

  To interact with the Founder agent:
  - SSH to 192.168.56.10:2220
  - Run the agent in interactive mode
  - Create stories and send to pipeline
