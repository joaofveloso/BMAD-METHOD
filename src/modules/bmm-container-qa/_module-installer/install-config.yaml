# BMM-Container-QA Module Installer Configuration
# Autonomous AI QA Agent Container Deployment
# Test automation and quality validation via SMTP

code: bmm-container-qa
name: "Container: QA (192.168.56.15)"
default_selected: false

header: "QA AI Agent Container"
subheader: |
  Deploy the QA AI agent to its dedicated container.
  Autonomous agent that writes tests, reviews PRs,
  and validates quality gates via SMTP.

  Container IP: 192.168.56.15
  SSH Port: 2225
  Email: qa@mail.email

# Dependencies
requires:
  - core
  - bmm-contractors

# Container configuration
container:
  name: "qa"
  ip: "192.168.56.15"
  ssh_port: 2225
  agent_file: "bmm-contractors/agents/qa-agent.agent.yaml"

# Local SMTP configuration
email_address:
  prompt: "QA agent email address"
  default: "qa@mail.email"
  result: "{value}"

smtp_password:
  prompt: "SMTP password for QA agent"
  default: "qa123"
  result: "{value}"
  secret: true
  env_var: "QA_SMTP_PASSWORD"

# Test frameworks
test_frameworks:
  prompt: "Test frameworks to use"
  default: ["junit", "playwright"]
  result: "{value}"
  multi-select:
    - value: "junit"
      label: "JUnit 5 (Java)"
    - value: "playwright"
      label: "Playwright (E2E)"
    - value: "jest"
      label: "Jest (JavaScript)"
    - value: "espresso"
      label: "Espresso (Android)"

# Coverage threshold
coverage_threshold:
  prompt: "Minimum code coverage percentage"
  default: "80"
  result: "{value}"

# Polling interval
polling_interval:
  prompt: "Email polling interval (seconds)"
  default: "60"
  result: "{value}"

# Files to install
install_files:
  - source: "bmm-contractors/agents/qa-agent.agent.yaml"
    destination: "agents/qa-agent.agent.yaml"
  - source: "bmm-contractors/scripts/email_processor.py"
    destination: "scripts/email_processor.py"
  - source: "bmm-contractors/scripts/email_manager.py"
    destination: "scripts/email_manager.py"

# Environment variables
env_vars:
  QA_SMTP_PASSWORD: "{smtp_password}"
  QA_EMAIL: "{email_address}"
  CONTAINER_IP: "192.168.56.15"
  CONTAINER_NAME: "qa"
  COVERAGE_THRESHOLD: "{coverage_threshold}"
  POLLING_INTERVAL: "{polling_interval}"

# SMTP config
smtp_config:
  server: "mail.email"
  port: 587
  tls: true
  imap_server: "mail.email"
  imap_port: 993

post_install_message: |
  QA container configured!

  Next steps:
  1. Set up the container at 192.168.56.15
  2. Install test frameworks
  3. Configure local mail server (Postfix/Dovecot)
  4. Copy installed files to the container
  5. Set environment variable: QA_SMTP_PASSWORD
  6. Start the agent runtime (polling mode)

  QA agent will enforce {coverage_threshold}% code coverage.
