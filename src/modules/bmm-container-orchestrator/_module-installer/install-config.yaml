# BMM-Container-Orchestrator Module Installer Configuration
# Autonomous AI Orchestrator Agent Container Deployment
# Central coordinator that routes work to AI agents via SMTP

code: bmm-container-orchestrator
name: "Container: Orchestrator (192.168.56.11)"
default_selected: false

header: "Orchestrator AI Agent Container"
subheader: |
  Deploy the Orchestrator AI agent to its dedicated container.
  Central coordinator that routes stories to agents, monitors progress,
  handles failures, and reports status via SMTP.

  Container IP: 192.168.56.11
  SSH Port: 2221
  Email: orchestrator@localdomain

# Dependencies
requires:
  - core
  - bmm-contractors

# Container configuration
container:
  name: "orchestrator"
  ip: "192.168.56.11"
  ssh_port: 2221
  agent_file: "bmm-contractors/agents/orchestrator-agent.agent.yaml"

# Local SMTP configuration
email_address:
  prompt: "Orchestrator email address"
  default: "orchestrator@localdomain"
  result: "{value}"

smtp_password:
  prompt: "SMTP password for orchestrator"
  default: ""
  result: "{value}"
  secret: true
  env_var: "ORCHESTRATOR_SMTP_PASSWORD"

# Polling interval
polling_interval:
  prompt: "Email polling interval (seconds)"
  default: "60"
  result: "{value}"

# Self-healing config
max_iterations:
  prompt: "Max self-healing iterations before escalating to founder"
  default: "3"
  result: "{value}"

story_timeout_hours:
  prompt: "Hours before a story times out"
  default: "48"
  result: "{value}"

# Files to install
install_files:
  - source: "bmm-contractors/agents/orchestrator-agent.agent.yaml"
    destination: "agents/orchestrator-agent.agent.yaml"
  - source: "bmm-contractors/templates/email/"
    destination: "templates/email/"

# Environment variables
env_vars:
  ORCHESTRATOR_SMTP_PASSWORD: "{smtp_password}"
  ORCHESTRATOR_EMAIL: "{email_address}"
  CONTAINER_IP: "192.168.56.11"
  CONTAINER_NAME: "orchestrator"
  POLLING_INTERVAL: "{polling_interval}"
  MAX_ITERATIONS: "{max_iterations}"
  STORY_TIMEOUT_HOURS: "{story_timeout_hours}"

# SMTP config for local mail
smtp_config:
  server: "localhost"
  port: 25
  tls: false
  imap_server: "localhost"
  imap_port: 143

post_install_message: |
  Orchestrator container configured!

  Next steps:
  1. Set up the container at 192.168.56.11
  2. Configure local mail server (Postfix/Dovecot)
  3. Copy installed files to the container
  4. Set environment variable: ORCHESTRATOR_SMTP_PASSWORD
  5. Start the agent runtime (polling mode)

  The orchestrator will:
  - Poll inbox every {polling_interval} seconds
  - Route stories to appropriate agents
  - Handle self-healing (max {max_iterations} iterations)
  - Escalate to founder after {story_timeout_hours}h timeout
